  weekly_ritual: 25
  reflection_filled: 30
  weekly_review: 40
  deep_block: 40
  rung_shipped: 200
  rung_zero_extension_bonus: 50
  rung_extension_penalty: 25
  rung_shipped_floor: 100
  rung_failed_moved_on: 50
  exam_gate: 300
