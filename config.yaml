ritual_times:
  # long-way ritual times (reduced schedule - 3 days/week)
  morning_reading: 06:00
  anki: 08:30
  evening_hands_on: '19:00'
  friday_review: '20:00'
  saturday_deep_block: 09:00
  sunday_trace: '19:00'
  weekly_state_review: '10:00'

priority_order:
- marketplace-builder
- long-way

syllabuses:
  marketplace-builder:
    path: curricula/marketplace-builder
    # PLACEHOLDER — replace with the real Todoist project ID before any
    # live (non-dry-run) engine run. Ask the owner; do not guess.
    todoist_project_id: REPLACE_ME_TODOIST_PROJECT_ID
    state_file: state/marketplace-builder.yaml
    enabled: true
    ritual_times:
      # Overrides of the 7 global (long-way) slots — every (slot, time)
      # pair must be unique across enabled syllabuses, so all are shifted
      # off long-way's claims even where marketplace-builder reuses none.
      morning_reading: '08:00'
      anki: '07:30'                   # daily Anki, Mon-Sat
      evening_hands_on: '19:30'
      friday_review: '20:30'
      saturday_deep_block: '14:00'    # Sat deep block (RFC/ADR + build)
      sunday_trace: '20:30'
      weekly_state_review: '11:00'    # Sunday state review
      # marketplace-builder's own slots
      saa_morning: '08:00'            # SAA course study, Mon-Sat while cert live
      build_monday: '19:30'           # build session
      build_wednesday: '19:30'        # build session
      bootdev_tuesday: '19:30'        # boot.dev just-in-time
      saa_lab_thursday: '19:30'       # SAA labs / practice exams (while cert live)
      bootdev_thursday: '19:30'       # second boot.dev session (after SAA done)
      friday_reflection: '20:30'      # Friday reflection
      design_review: '17:00'          # weekly design review (flexible; Monday default)
      ship_log: '09:30'               # 1st of month
      cert_checkin: '15:00'           # 15th of month, gated to cert tracks
      restore_drill: '20:00'          # monthly, day 10, module 5 onward
      game_day: '14:00'               # monthly, last Saturday, module 5 onward

  # superseded — cert goals live on inside marketplace-builder; files
  # kept as reference. Re-enable by flipping `enabled` and adding the
  # key back to priority_order.
  devops-ready:
    path: curricula/devops-ready
    todoist_project_id: 6gpVRwqVmjqRc7hX
    state_file: state/devops-ready.yaml
    enabled: false
    # Adjusted ritual times to avoid collisions with long-way
    ritual_times:
      morning_reading: 08:00           # Reusing morning_udemy slot (same ritual)
      anki: 07:30                      # Reusing devops_srs slot (same ritual)
      devops_srs: 07:30                # No collision
      morning_udemy: 08:00             # No collision
      evening_hands_on: '21:30'        # Shifted from 19:00, then 20:00 to avoid all long-way collisions
      weekly_state_review: '11:00'     # Shifted from 10:00 to avoid long-way
      bootdev_monday: '19:00'          # boot.dev session (every weekday)
      bootdev_tuesday: '19:00'         # boot.dev session
      bootdev_wednesday: '19:00'       # boot.dev session
      bootdev_thursday: '19:00'        # boot.dev session
      bootdev_friday: '19:00'          # boot.dev session (before reflection)
      leetcode_session: '20:30'        # LeetCode alternate days (Mon/Wed/Fri, after boot.dev)
      saturday_deep_block: '14:00'     # Shifted from 09:00 to avoid long-way
      friday_review: '22:00'           # Reusing friday_reflection slot (same ritual)
      friday_reflection: '22:00'       # Shifted from 21:00 to run after evening_hands_on
      sunday_trace: '20:00'            # Shifted from 19:00 to avoid long-way
      monthly_project_publish: 09:00   # No collision
      monthly_cert_check: '14:00'      # No collision
      monthly_mock_interview: '14:00'  # No collision
      monthly_retrospective: '15:00'   # No collision
  
  long-way:
    path: curricula/long-way
    todoist_project_id: 6gWxC2wh5WRvjfw2
    state_file: state/long-way.yaml
    enabled: true
    # SATURDAY-ONLY: long-way is relegated to Saturdays while devops-ready is
    # the focus track. One long CS:APP reading session + Anki on Saturday
    # (see curricula/long-way/rituals/daily.yaml). Sunday state review still
    # fires. Timeline extends proportionally.
sunday_off: true
pair_day: thursday
dashboard:
  github_username: SauravSuresh
  repo_name: long-way-engine
