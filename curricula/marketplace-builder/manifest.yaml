# Manifest for Marketplace Builder curriculum
# Build-first syllabus: the rental-equipment booking platform is the
# spine; reading is pulled by problems. All cert/course theory (SAA,
# CKA, boot.dev, LeetCode) belongs to the devops-ready curriculum,
# which runs in parallel — one concern, one curriculum.

ritual_times_required:
  - anki                    # Daily Anki, build deck (Mon-Sat)
  - build_monday            # Build session (Mon 20:00, between devops bootdev & LeetCode)
  - build_wednesday         # Build session (Wed 20:00)
  - friday_reflection       # Friday reflection (18:30, before devops bootdev)
  - saturday_deep_block     # Saturday deep block 09:30 (devops project block owns 14:00)
  - design_review           # Weekly design review with senior engineers
  - weekly_state_review     # Sunday state review (11:30; devops review is 11:00)
  - ship_log                # 1st of month: ship log publish
  - restore_drill           # Monthly restore drill (module 5 onward)
  - game_day                # Monthly game day (module 5 onward, last Saturday)

placeholders_used:
  - current_book
  - current_module
  - next_module
  - current_phase_name
  - iso_year
  - iso_week
  - year
  - month
  - ritual_times.anki
  - ritual_times.build_monday
  - ritual_times.build_wednesday
  - ritual_times.friday_reflection
  - ritual_times.saturday_deep_block
  - ritual_times.design_review
  - ritual_times.weekly_state_review
  - ritual_times.ship_log
  - ritual_times.restore_drill
  - ritual_times.game_day

config_flags:
  pair_day: thursday
  sunday_off: true
