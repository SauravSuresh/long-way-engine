# Manifest for Marketplace Builder curriculum
# Build-first syllabus: the rental-equipment booking platform is the
# spine; reading is pulled by problems. Certs (SAA now, CKA post-launch)
# are the one deliberate scheduled-theory exception.

ritual_times_required:
  - anki                    # Daily Anki (Mon-Sat)
  - saa_morning             # SAA course study (Mon-Sat, while SAA track current)
  - build_monday            # Build session (Mon evening)
  - build_wednesday         # Build session (Wed evening)
  - bootdev_tuesday         # boot.dev just-in-time session (Tue evening)
  - saa_lab_thursday        # SAA labs / practice exams (Thu, while SAA current)
  - bootdev_thursday        # second boot.dev session (Thu, after SAA done)
  - friday_reflection       # Friday reflection + earned-reading question
  - saturday_deep_block     # Saturday deep block (RFC/ADR first 30 min + build)
  - design_review           # Weekly design review with senior engineers
  - weekly_state_review     # Sunday state review
  - ship_log                # 1st of month: ship log publish
  - cert_checkin            # 15th of month: cert check-in (gated to cert tracks)
  - restore_drill           # Monthly restore drill (module 5 onward)
  - game_day                # Monthly game day (module 5 onward, last Saturday)

placeholders_used:
  - current_book
  - current_module
  - next_module
  - current_phase_name
  - iso_year
  - iso_week
  - year
  - month
  - ritual_times.anki
  - ritual_times.saa_morning
  - ritual_times.build_monday
  - ritual_times.build_wednesday
  - ritual_times.bootdev_tuesday
  - ritual_times.saa_lab_thursday
  - ritual_times.bootdev_thursday
  - ritual_times.friday_reflection
  - ritual_times.saturday_deep_block
  - ritual_times.design_review
  - ritual_times.weekly_state_review
  - ritual_times.ship_log
  - ritual_times.cert_checkin
  - ritual_times.restore_drill
  - ritual_times.game_day

config_flags:
  pair_day: thursday
  sunday_off: true
