# Manifest for Marketplace Builder curriculum
# Build-first syllabus: the rental-equipment booking platform is the
# spine; reading is pulled by problems. All cert/course theory (SAA,
# CKA, boot.dev, LeetCode) belongs to the devops-ready curriculum,
# which runs in parallel — one concern, one curriculum.

ritual_times_required:
  - anki                    # Daily Anki, ALL decks in one sitting (Mon-Sat 07:15)
  - build_tuesday           # Ladder session (Tue 20:45 — the week's one rung evening)
  - weekly_reflection       # Saturday close-out reflection (lw reflect)
  - saturday_deep_block     # Saturday deep block 09:30-13:00 (the platform)
  - weekly_state_review     # Saturday close-out state review (lw review)
  - ship_log                # 1st of month: ship log publish
  - restore_drill           # Monthly restore drill (module 5 onward)
  - game_day                # Monthly game day (module 5 onward, last Saturday)

placeholders_used:
  - current_book
  - current_module
  - next_module
  - current_phase_name
  - iso_year
  - iso_week
  - year
  - month
  - ritual_times.anki
  - ritual_times.build_tuesday
  - ritual_times.weekly_reflection
  - ritual_times.saturday_deep_block
  - ritual_times.weekly_state_review
  - ritual_times.ship_log
  - ritual_times.restore_drill
  - ritual_times.game_day

config_flags:
  pair_day: thursday
  sunday_off: true
