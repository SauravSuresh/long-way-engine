- id: challenge-35
  title: "Challenge 35: Operate (~2.5 wk) [EXAM GATES 3 & 4]"
  description: |
    Build: SLIs/SLOs (booking-confirm p99, webhook success rate),
    structured logs with request IDs, OTel tracing (challenge 27) to
