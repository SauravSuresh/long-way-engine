    ★ EXAM GATE 3: restore the production DB from backup to a
    working platform in under 1 hour, timed. Then monthly (see
    rituals/monthly.yaml).
    ★ EXAM GATE 4: first game day — kill the DB failover, follow
    your runbook, write the postmortem. Then monthly.
    Pull reading: Release It! after the incident.
    Done when: gates 3 & 4 done · /challenge-review run.
  due: "today at {ritual_times.build_monday}"
  labels: [challenge, phase-4, exam-gate]
  cadence: once-per-module
  module_number: 35

- id: challenge-36
  title: "Challenge 36: Launch hardening & go-live (~2 wk)"
  description: |
    Build: the last mile — rate limiting at the edge and per-user,
