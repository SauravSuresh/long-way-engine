# Challenge briefs for the Marketplace Builder ladder.
# One module = one challenge. The loop, every time:
#   1. Read the brief. Write the ADR FIRST (Nygard template: context ->
#      options -> decision -> consequences). Bad ADRs are fine early.
#   2. Build it in Go. Tests are part of "built".
#   3. Run /challenge-review (Claude skill) — it reviews design, Go
#      idioms, testing, and missed failure modes, and names what to
#      read. Log the takeaways in Friday's reflection.
#   4. Advance via the Sunday state review.
# All challenges live in one repo: go-ladder/challenge-NN-name/.

# ============ Phase 1: Foundations (1 week each) ============

- id: challenge-1
  title: "Challenge 1: Calculator CLI (~1 wk)"
  description: |
    Build: a CLI that evaluates expressions: `calc "2 + 3 * (4 - 1)"`.
    Must: +-*/, parentheses, precedence, clear errors for bad input,
    table-driven tests covering edge cases (div by zero, garbage).
    ADR question: how do you parse — regex hacks, shunting-yard, or a
    tiny recursive-descent parser? Pick, justify, note trade-offs.
    Done when: tests pass · ADR committed · /challenge-review run.
  due: "today at {ritual_times.build_monday}"
  labels: [challenge, phase-1]
  cadence: once-per-module
  module_number: 1

- id: challenge-2
  title: "Challenge 2: Todo CLI with JSON persistence (~1 wk)"
  description: |
    Build: `todo add/list/done/rm` persisting to a JSON file.
    Must: survives restarts, handles a corrupt/missing file without
    losing data (write temp + rename), IDs stay stable, tests use a
    temp dir.
    ADR question: file format & write strategy — what happens if the
    process dies mid-write?
    Done when: tests pass · ADR committed · /challenge-review run.
  due: "today at {ritual_times.build_monday}"
  labels: [challenge, phase-1]
  cadence: once-per-module
  module_number: 2

- id: challenge-3
  title: "Challenge 3: grep clone (~1 wk)"
  description: |
    Build: `gogrep [-i] [-n] [-r] PATTERN [PATH...]`, reads stdin when
    no path given.
    Must: io.Reader-based core (testable without files), works on big
    files without loading them whole, exit codes match real grep.
    ADR question: where's the seam between CLI and engine? Design the
    core as a package a server could reuse.
    Done when: tests pass · ADR committed · /challenge-review run.
  due: "today at {ritual_times.build_monday}"
  labels: [challenge, phase-1]
  cadence: once-per-module
  module_number: 3

- id: challenge-4
  title: "Challenge 4: API-client CLI (~1 wk)"
  description: |
    Build: a CLI that calls a public API (currency rates or weather)
    and prints a formatted answer.
    Must: timeouts, context cancellation, retry with backoff on 5xx,
    graceful message when offline, HTTP layer mocked in tests
    (httptest).
    ADR question: how do you make code that talks to the network
    testable?
    Done when: tests pass · ADR committed · /challenge-review run.
  due: "today at {ritual_times.build_monday}"
  labels: [challenge, phase-1]
  cadence: once-per-module
  module_number: 4

- id: challenge-5
  title: "Challenge 5: Append-only key-value store (~1 wk)"
  description: |
    Build: `kv set/get/del` backed by an append-only log file,
    rebuilt into a map on startup.
    Must: recovery test (kill mid-write, reopen, data intact),
    compaction when the log doubles, benchmark get/set.
    ADR question: log format + when to fsync — durability vs speed.
    Done when: tests pass · ADR committed · /challenge-review run.
  due: "today at {ritual_times.build_monday}"
  labels: [challenge, phase-1]
  cadence: once-per-module
  module_number: 5

- id: challenge-6
  title: "Challenge 6: Worker-pool file processor (~1 wk)"
  description: |
    Build: hash (or thumbnail) every file under a directory using N
    workers.
    Must: goroutines + channels or errgroup, bounded concurrency,
    first error cancels the rest, progress output, race-free
    (`go test -race`).
    ADR question: channels vs errgroup vs semaphore — which pattern
    and why?
    Done when: race detector clean · ADR committed · /challenge-review run.
  due: "today at {ritual_times.build_monday}"
  labels: [challenge, phase-1]
  cadence: once-per-module
  module_number: 6

- id: challenge-7
  title: "Challenge 7: Rate-limiter library (~1 wk)"
  description: |
    Build: a token-bucket rate limiter as an importable package.
    Must: per-key limits, thread-safe, tests use a fake clock (no
    time.Sleep in tests), README documenting the API like a real lib.
    ADR question: what does a good Go library API look like —
    interfaces, options pattern, zero values?
    Done when: tests pass · ADR committed · /challenge-review run.
  due: "today at {ritual_times.build_monday}"
  labels: [challenge, phase-1]
  cadence: once-per-module
  module_number: 7

- id: challenge-8
  title: "Challenge 8: TTL + LRU cache (~1 wk)"
  description: |
    Build: an in-memory cache with max entries (LRU eviction) and
    per-entry TTL.
    Must: O(1) get/set, thread-safe, benchmarks proving no lock
    collapse under parallel load, race-clean.
    ADR question: locking strategy — one mutex, sharded, or
    sync.Map? Measure, don't guess.
    Done when: benchmarks committed · ADR committed · /challenge-review run.
  due: "today at {ritual_times.build_monday}"
  labels: [challenge, phase-1]
  cadence: once-per-module
  module_number: 8

# ============ Phase 2: Services (1-1.5 weeks each) ============

- id: challenge-9
  title: "Challenge 9: Notes API, stdlib only (~1 wk)"
  description: |
    Build: CRUD JSON API for notes with net/http, no framework.
    Must: middleware chain (logging, request ID, panic recovery), one
    error envelope everywhere, httptest coverage, in-memory store
    behind an interface.
    ADR question: project layout for a Go service — package
    boundaries you won't regret.
    Done when: tests pass · ADR committed · /challenge-review run.
  due: "today at {ritual_times.build_monday}"
  labels: [challenge, phase-2]
  cadence: once-per-module
  module_number: 9

- id: challenge-10
  title: "Challenge 10: Notes API on Postgres (~1 wk)"
  description: |
    Build: swap challenge 9's store for Postgres (pgx or sqlc),
    docker-compose for local dev, versioned migrations.
    Must: the store interface holds (handlers untouched), integration
    tests against real Postgres, connection pool configured on
    purpose.
    ADR question: SQL approach — ORM, sqlc, raw pgx? Justify for a
    solo maintainer.
    Done when: integration tests pass · ADR committed · /challenge-review run.
  due: "today at {ritual_times.build_monday}"
  labels: [challenge, phase-2]
  cadence: once-per-module
  module_number: 10

- id: challenge-11
  title: "Challenge 11: Auth — sessions, JWT, roles (~1.5 wk)"
  description: |
    Build: signup/login on the notes API; owner-only access; an
    admin role that sees everything.
    Must: bcrypt/argon2 hashing, JWT or session cookie (pick via
    ADR), authN + authZ middleware, tests for the forbidden paths —
    the attacks, not just the happy path.
    ADR question: sessions vs JWT for THIS app; where do tokens live;
    what's the revocation story?
    Done when: forbidden-path tests pass · ADR committed · /challenge-review run.
  due: "today at {ritual_times.build_monday}"
  labels: [challenge, phase-2]
  cadence: once-per-module
  module_number: 11

- id: challenge-12
  title: "Challenge 12: Spec-first URL shortener (~1 wk)"
  description: |
    Build: write the OpenAPI 3 spec FIRST (endpoints, errors,
    pagination), get it linted (spectral), then implement to the spec.
    Must: contract tests (schemathesis or manual) proving the
    implementation matches the spec, redirect handling, hit counter.
    ADR question: what makes an API contract good — naming,
    versioning, error codes. Use API Design Patterns as desk reference.
    Done when: contract tests pass · ADR committed · /challenge-review run.
  due: "today at {ritual_times.build_monday}"
  labels: [challenge, phase-2]
  cadence: once-per-module
  module_number: 12

- id: challenge-13
  title: "Challenge 13: File upload service (~1 wk)"
  description: |
    Build: multipart upload endpoint streaming to S3-compatible
    storage (MinIO locally), download via presigned URL.
    Must: no buffering whole files in memory, size/type limits,
    content-addressed keys, cleanup of failed uploads.
    ADR question: stream vs buffer, and who owns object lifecycle?
    Done when: tests pass with MinIO · ADR committed · /challenge-review run.
  due: "today at {ritual_times.build_monday}"
  labels: [challenge, phase-2]
  cadence: once-per-module
  module_number: 13

- id: challenge-14
  title: "Challenge 14: Webhook receiver (~1.5 wk)"
  description: |
    Build: an endpoint receiving signed webhooks (simulate a payment
    provider): verify signature, process idempotently, tolerate
    retries and out-of-order delivery.
    Must: replay the same event 10x -> state changes once; reject bad
    signatures; store-then-process (don't do work in the handler);
    tests hammer the replay path.
    ADR question: idempotency key design + at-least-once delivery —
    this is dress rehearsal for real payments (challenge 32).
    Done when: replay tests pass · ADR committed · /challenge-review run.
  due: "today at {ritual_times.build_monday}"
  labels: [challenge, phase-2]
  cadence: once-per-module
  module_number: 14

- id: challenge-15
  title: "Challenge 15: Job queue on Postgres (~1.5 wk)"
  description: |
    Build: background jobs (e.g. send email, resize image) queued in
    Postgres, N workers consuming with FOR UPDATE SKIP LOCKED.
    Must: retries with backoff, max-attempts -> dead-letter table,
    jobs survive worker crashes, concurrent-worker test proves no
    double-processing.
    ADR question: why SKIP LOCKED beats a naive polling loop; when
    would you graduate to a real broker?
    Done when: crash/concurrency tests pass · ADR committed · /challenge-review run.
  due: "today at {ritual_times.build_monday}"
  labels: [challenge, phase-2]
  cadence: once-per-module
  module_number: 15

- id: challenge-16
  title: "Challenge 16: Search + cursor pagination (~1 wk)"
  description: |
    Build: full-text search over notes (Postgres tsvector) with
    cursor-based pagination.
    Must: stable cursors under concurrent inserts (test it!), why
    OFFSET breaks documented in the ADR, ranked results, index +
    EXPLAIN ANALYZE before/after committed.
    ADR question: cursor encoding and index design.
    Done when: pagination tests pass · ADR committed · /challenge-review run.
  due: "today at {ritual_times.build_monday}"
  labels: [challenge, phase-2]
  cadence: once-per-module
  module_number: 16

- id: challenge-17
  title: "Challenge 17: Dockerize + graceful shutdown (~1 wk)"
  description: |
    Build: production-shaped packaging for the notes stack —
    multi-stage Dockerfile, compose with healthchecks, config from
    env, graceful shutdown draining in-flight requests.
    Must: SIGTERM test (in-flight request completes, new ones
    refused), image under 30MB, /healthz + /readyz distinct.
    ADR question: 12-factor config — what's env, what's flag, what's
    file?
    Done when: shutdown test passes · ADR committed · /challenge-review run.
  due: "today at {ritual_times.build_monday}"
  labels: [challenge, phase-2]
  cadence: once-per-module
  module_number: 17

- id: challenge-18
  title: "Challenge 18: Load-test & profile (~1.5 wk)"
  description: |
    Build: a k6 load profile for the notes API; find the bottleneck
    with pprof; fix it; prove the fix with numbers.
    Must: before/after graphs committed, flamegraph screenshot, the
    fix is one deliberate change (not a shotgun), write-up of the
    hunt.
    ADR question: none — this one produces a performance report
    instead. Same rigor: hypothesis -> measurement -> conclusion.
    Done when: report committed · /challenge-review run.
  due: "today at {ritual_times.build_monday}"
  labels: [challenge, phase-2]
  cadence: once-per-module
  module_number: 18

# ======= Phase 3: Concurrency & Distribution (1.5-2 wk each) =======

- id: challenge-19
  title: "Challenge 19: TCP chat server (~1.5 wk)"
  description: |
    Build: raw TCP chat — rooms, nicknames, broadcast.
    Must: one goroutine per conn done safely, slow-client
    backpressure (drop or disconnect — decide in ADR), clean
    disconnect handling, race-clean under a 100-client test.
    ADR question: fan-out design and what happens when a client
    can't keep up.
    Done when: 100-client test passes · ADR committed · /challenge-review run.
  due: "today at {ritual_times.build_monday}"
  labels: [challenge, phase-3]
  cadence: once-per-module
  module_number: 19

- id: challenge-20
  title: "Challenge 20: Mini-Redis (~2 wk)"
  description: |
    Build: a RESP-speaking server: GET/SET/DEL/EXPIRE/TTL, works
    with the real redis-cli.
    Must: protocol parser with its own tests, concurrent clients,
    active+lazy expiry, benchmark vs real Redis (know why you lose).
    ADR question: single event loop vs mutex-guarded map vs shards.
    Done when: redis-cli works · ADR committed · /challenge-review run.
  due: "today at {ritual_times.build_monday}"
  labels: [challenge, phase-3]
  cadence: once-per-module
  module_number: 20

- id: challenge-21
  title: "Challenge 21: Pub/sub broker (~2 wk)"
  description: |
    Build: a broker: topics, publish, subscribe, at-least-once
    delivery with acks and redelivery on timeout.
    Must: consumer crash test (message redelivered), persistent
    queue (reuse challenge 5's log!), ordering guarantees stated
    honestly in the README.
    ADR question: what delivery guarantee can you actually promise,
    and what does the consumer have to do because of it?
    Done when: crash tests pass · ADR committed · /challenge-review run.
  due: "today at {ritual_times.build_monday}"
  labels: [challenge, phase-3]
  cadence: once-per-module
  module_number: 21

- id: challenge-22
  title: "Challenge 22: Distributed lock & leader election (~1.5 wk)"
  description: |
    Build: N copies of a worker where exactly one is active, using
    Postgres advisory locks (or lease rows with expiry).
    Must: kill the leader -> another takes over within seconds;
    fencing token so a paused old leader can't corrupt state; chaos
    test in CI.
    ADR question: leases, clocks, and why "exactly one" is harder
    than it looks.
    Done when: failover test passes · ADR committed · /challenge-review run.
  due: "today at {ritual_times.build_monday}"
  labels: [challenge, phase-3]
  cadence: once-per-module
  module_number: 22

- id: challenge-23
  title: "Challenge 23: Consistent-hashing cache client (~1.5 wk)"
  description: |
    Build: a client library sharding keys across 3 mini-redis nodes
    (challenge 20) with a consistent-hash ring + virtual nodes.
    Must: adding/removing a node remaps only ~1/N keys (prove with a
    test), dead-node handling, ring visualized in the README.
    ADR question: rebalancing strategy and what consistency you give
    up during it.
    Done when: remap test passes · ADR committed · /challenge-review run.
  due: "today at {ritual_times.build_monday}"
  labels: [challenge, phase-3]
  cadence: once-per-module
  module_number: 23

- id: challenge-24
  title: "Challenge 24: Replicated log (~2 wk)"
  description: |
    Build: consensus-lite — a 3-node replicated log: one leader
    accepts writes, replicates to followers, acks at majority;
    followers serve reads with staleness labeled.
    Must: kill a follower (writes continue), kill the leader
    (re-elect via challenge 22), all nodes converge — proven by test.
    Not full Raft; the ADR states exactly which guarantees you
    dropped and why.
    ADR question: what does "committed" mean in your system?
    Done when: convergence tests pass · ADR committed · /challenge-review run.
  due: "today at {ritual_times.build_monday}"
  labels: [challenge, phase-3]
  cadence: once-per-module
  module_number: 24

- id: challenge-25
  title: "Challenge 25: Event-sourced ledger (~2 wk)"
  description: |
    Build: an account ledger where the events are the truth:
    deposit/withdraw/transfer appended, balances are projections,
    full replay rebuilds state.
    Must: negative-balance rejected at the command layer, projection
    rebuild test, snapshotting once replay gets slow, idempotent
    command handling (client retries!).
    ADR question: event schema evolution — what happens when an
    event's shape must change?
    Done when: replay test passes · ADR committed · /challenge-review run.
  due: "today at {ritual_times.build_monday}"
  labels: [challenge, phase-3]
  cadence: once-per-module
  module_number: 25

- id: challenge-26
  title: "Challenge 26: Outbox pattern — money transfer (~2 wk)"
  description: |
    Build: two services (accounts, notifications) where a transfer
    must update balances AND notify — atomically-ish, via a
    transactional outbox + the pub/sub broker (challenge 21).
    Must: crash between DB commit and publish loses nothing (test
    it), consumer dedup, end-to-end test across both services.
    ADR question: why two-phase commit is off the table and what the
    outbox costs you instead.
    Done when: crash tests pass · ADR committed · /challenge-review run.
  due: "today at {ritual_times.build_monday}"
  labels: [challenge, phase-3]
  cadence: once-per-module
  module_number: 26

- id: challenge-27
  title: "Challenge 27: OpenTelemetry across the stack (~1.5 wk)"
  description: |
    Build: wire tracing + metrics through challenges 21/26's
    services: one trace follows a transfer end-to-end across service
    and queue boundaries.
    Must: trace context propagates through the broker, RED metrics
    dashboard (Grafana or console), one real question answered with
    a trace ("where did the 400ms go?").
    ADR question: what to instrument vs what's noise.
    Done when: cross-service trace screenshot committed · /challenge-review run.
  due: "today at {ritual_times.build_monday}"
  labels: [challenge, phase-3]
  cadence: once-per-module
  module_number: 27

- id: challenge-28
  title: "Challenge 28: Chaos week (~1.5 wk)"
  description: |
    Build: nothing new — break everything. Inject failures into the
    challenge 26 stack: kill processes mid-transfer, partition the
    broker, corrupt a projection, fill the disk.
    Must: a runbook per failure written BEFORE injecting it, then
    corrected after; one postmortem for the failure that surprised
    you most; fixes shipped for anything that lost data.
    Done when: runbooks + postmortem committed · /challenge-review run.
  due: "today at {ritual_times.build_monday}"
  labels: [challenge, phase-3]
  cadence: once-per-module
  module_number: 28

# ========= Phase 4: The Platform (2-3 weeks each) =========
# From here every challenge is a rental-platform component.
# The ladder's summit is the launched product.

- id: challenge-29
  title: "Challenge 29: Booking-hold service (~2.5 wk) [EXAM GATE 1]"
  description: |
    Build: the heart of the platform — equipment, availability
    calendar, holds with expiry, confirm-or-release.
    Must: two people can NEVER hold the same kit for overlapping
    dates — exclusion constraint / SELECT FOR UPDATE / serializable,
    chosen and justified in the ADR.
    ★ EXAM GATE 1: a concurrency hammer test — hundreds of parallel
    overlapping booking attempts, zero double-books, run in CI.
    Pull reading: DDIA transactions chapters when the tests confuse you.
    Done when: gate 1 passes in CI · ADR committed · /challenge-review run.
  due: "today at {ritual_times.build_monday}"
  labels: [challenge, phase-4, exam-gate]
  cadence: once-per-module
  module_number: 29

- id: challenge-30
  title: "Challenge 30: Availability search (~2 wk)"
  description: |
    Build: "what's free in Kochi, May 3-7?" — calendar data model +
    fast availability search + cache with correct invalidation on
    every booking/hold/release.
    Must: correctness test (cache never shows a booked kit free),
    p95 latency measured under load (challenge 18 skills), cursor
    pagination (challenge 16 skills).
    ADR question: compute availability on read vs maintain on write.
    Done when: invalidation tests pass · ADR committed · /challenge-review run.
  due: "today at {ritual_times.build_monday}"
  labels: [challenge, phase-4]
  cadence: once-per-module
  module_number: 30

- id: challenge-31
  title: "Challenge 31: Spec-first booking API (~2 wk)"
  description: |
    Build: the platform's public API, spec first (challenge 12
    discipline at full scale): search, hold, confirm, cancel,
    equipment CRUD, auth (challenge 11), one error envelope.
    Must: OpenAPI published + linted, contract tests in CI,
    idempotency keys on every mutation, versioning strategy decided.
    Desk reference: API Design Patterns.
    Done when: contract tests pass · ADR committed · /challenge-review run.
  due: "today at {ritual_times.build_monday}"
  labels: [challenge, phase-4]
  cadence: once-per-module
  module_number: 31

- id: challenge-32
  title: "Challenge 32: Payments for India (~3 wk)"
  description: |
    Build: Razorpay test-mode end to end: order -> pay (UPI/cards) ->
    webhook -> confirm booking -> cancel -> refund (full + partial).
    Must: webhook handling is challenge 14 for real (signatures,
    idempotent, replay-proof); daily reconciliation job (challenge 15
    queue) comparing gateway settlements vs your ledger (challenge 25
    discipline); PCI scope write-up.
    Pull reading: The Anatomy of the Swipe when reconciliation
    confuses you.
    Done when: full flow idempotent under replay · ADR committed ·
    /challenge-review run.
  due: "today at {ritual_times.build_monday}"
  labels: [challenge, phase-4]
  cadence: once-per-module
  module_number: 32

- id: challenge-33
  title: "Challenge 33: Walking skeleton — assemble & deploy (~2 wk)"
  description: |
    Build: wire challenges 29-32 into ONE deployable app with a real
