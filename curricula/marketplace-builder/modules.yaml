    Must: a go/no-go checklist, then GO: first real listing, first
    real booking.
    Done when: the platform is live with real users · final
    /challenge-review run · ship log tells the story.
  due: "today at {ritual_times.build_monday}"
  labels: [challenge, phase-4]
  cadence: once-per-module
  module_number: 36
