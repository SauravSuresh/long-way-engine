    Done when: live URL works · stack ADR final · /challenge-review run.
  due: "today at {ritual_times.build_monday}"
  labels: [challenge, phase-4]
  cadence: once-per-module
  module_number: 33

- id: challenge-34
  title: "Challenge 34: Production infra on AWS (~3 wk) [EXAM GATE 2]"
  description: |
    Build: the SAA lab — this challenge applies the cert material
