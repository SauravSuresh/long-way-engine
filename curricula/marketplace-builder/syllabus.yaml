meta:
  name: Marketplace Builder
  total_months: 12
  start_month_index: 1

# TWO TRACKS, ONE CURRICULUM (post-grilling shape, 2026-08-02):
#
#   Saturdays  -> the REAL rental platform, from week 1. The first-12-
#                 sessions checklist lives in the Saturday deep block
#                 ritual; exam gates 1-4 and the stack ADR happen there.
#   Mon + Wed  -> the ladder: 16 concept rungs. Each rung = one concept;
#                 the rung's brief offers 3 candidate challenges and the
#                 owner picks ONE in the first session. Rungs advance via
#                 the Sunday state review (module advance).
#
# Rules that survived the grilling:
#   - Every challenge names a REAL CONSUMER before it starts (deployed,
#     published, or used by owner/startup). Realness = you operate it.
#   - Polyglot: Go is the default; a rung option may be taken in another
#     language when the ADR argues it teaches more.
#   - Rung order is biased to precede the platform's Saturday needs.
#   - /ladder-review after each challenge: ADVISORY only, verdict
#     committed to the challenge repo. The Sunday checkbox is the gate;
#     honesty is the owner's job.
#   - CRUNCH RULE: a bad week = Anki + one build session + Sunday
#     review (~3.5 h). Everything else drops guilt-free.
#   - Cert/course theory (SAA, CKA, boot.dev, LeetCode) stays on
#     devops-ready — one concern, one curriculum.
phases:
  - number: 1
    name: "Foundations (rungs 1-5)"
    months: [1, 3]

  - number: 2
    name: "Services (rungs 6-11)"
    months: [4, 7]

  - number: 3
    name: "Systems (rungs 12-16)"
    months: [8, 12]

# BOOKS: no scheduled reading. Reading is PULLED — reviews and felt
# problems name the chapter. primary_book_by_month keys are validator
# anchors only.
books:
  - title: "The Go Programming Language"
    author: "Donovan & Kernighan"
    phase: 1
    role: reference

  - title: "100 Go Mistakes and How to Avoid Them"
    author: "Teiva Harsanyi"
    phase: 1
    role: reference

  - title: "API Design Patterns"
    author: "JJ Geewax"
    phase: 2
    role: reference

  - title: "Designing Data-Intensive Applications"
    author: "Martin Kleppmann"
    phase: 3
    role: reference

  - title: "The Anatomy of the Swipe"
    author: "Ahmed Siddiqui"
    phase: 2
    role: reference

  - title: "Release It! (2nd Edition)"
    author: "Michael Nygard"
    phase: 3
    role: reference

primary_book_by_month:
  1: "The Go Programming Language"
  4: "API Design Patterns"
  7: "The Anatomy of the Swipe"
  9: "Designing Data-Intensive Applications"
  12: "Release It! (2nd Edition)"

# 16 rungs. estimated_hours = ladder budget only (Mon+Wed ≈ 3 h/wk;
# most rungs are ~2 weeks). Saturday hours belong to the platform.
modules:
  - { number: 1,  name: "CLI craft & tests",             phase: 1, estimated_hours: 6 }
  - { number: 2,  name: "Crash-safe persistence",        phase: 1, estimated_hours: 6 }
  - { number: 3,  name: "Network clients that don't lie",phase: 1, estimated_hours: 6 }
  - { number: 4,  name: "Concurrency basics",            phase: 1, estimated_hours: 6 }
  - { number: 5,  name: "A library with real users",     phase: 1, estimated_hours: 8 }
  - { number: 6,  name: "HTTP service from scratch",     phase: 2, estimated_hours: 8 }
  - { number: 7,  name: "Postgres for real",             phase: 2, estimated_hours: 8 }
  - { number: 8,  name: "Auth: sessions, tokens, roles", phase: 2, estimated_hours: 8 }
  - { number: 9,  name: "Spec-first API design",         phase: 2, estimated_hours: 8 }
  - { number: 10, name: "Webhooks & idempotency",        phase: 2, estimated_hours: 8 }
  - { number: 11, name: "Jobs, queues & retries",        phase: 2, estimated_hours: 8 }
  - { number: 12, name: "Ship it & keep it up",          phase: 3, estimated_hours: 10 }
  - { number: 13, name: "Performance: measure, then fix",phase: 3, estimated_hours: 10 }
  - { number: 14, name: "Wire protocols",                phase: 3, estimated_hours: 10 }
  - { number: 15, name: "Distributed coordination",      phase: 3, estimated_hours: 12 }
  - { number: 16, name: "Reliability engineering",       phase: 3, estimated_hours: 12 }

tracks:
  # The Saturday platform build — current from day one.
  - title: "Rental platform build"
    category: Platform
    phase: 1

  # Flipped to current (via Sunday state review) once the platform is
  # deployed to production infra; gates the monthly restore drill and
  # game day.
  - title: "Platform in production"
    category: Platform
    phase: 3
