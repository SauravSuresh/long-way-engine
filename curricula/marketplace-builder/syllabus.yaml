meta:
  name: Marketplace Builder
  total_months: 6
  start_month_index: 1

phases:
  - number: 1
    name: "Foundation: Skeleton, Spec, Data"
    months: [1, 3]

  - number: 2
    name: "Money & Production"
    months: [4, 6]

# BOOKS: no scheduled reading in this curriculum. Reading is PULLED by
# problems felt during the build — each module description carries a
# pull-reading trigger table. All entries are reference-role; the
# primary_book_by_month keys below are validator-satisfying anchors
# only (state.month must stay <= max month key). Cert/course theory
# (SAA, CKA, boot.dev, LeetCode) lives entirely on the devops-ready
# curriculum, which runs in parallel — one concern, one curriculum.
books:
  - title: "Designing Data-Intensive Applications"
    author: "Martin Kleppmann"
    phase: 1
    role: reference   # pulled when concurrency tests confuse me (module 3)

  - title: "API Design Patterns"
    author: "JJ Geewax"
    phase: 1
    role: reference   # desk reference during module 2

  - title: "The Anatomy of the Swipe"
    author: "Ahmed Siddiqui"
    phase: 2
    role: reference   # pulled when reconciliation confuses me (module 4)

  - title: "Release It! (2nd Edition)"
    author: "Michael Nygard"
    phase: 2
    role: reference   # pulled after my first real incident (module 6)

primary_book_by_month:
  1: "API Design Patterns"             # anchor, not scheduled reading
  3: "Designing Data-Intensive Applications"
  4: "The Anatomy of the Swipe"
  6: "Release It! (2nd Edition)"

modules:
  - number: 1
    name: "Walking Skeleton & Stack ADR"
    phase: 1
    estimated_hours: 50

  - number: 2
    name: "API Spec-First"
    phase: 1
    estimated_hours: 50

  - number: 3
    name: "Data Modeling & Booking Concurrency"
    phase: 1
    estimated_hours: 55

  - number: 4
    name: "Payments for India"
    phase: 2
    estimated_hours: 50

  - number: 5
    name: "Production Infra on AWS"
    phase: 2
    estimated_hours: 65

  - number: 6
    name: "Operate: Observability, Reliability, Security"
    phase: 2
    estimated_hours: 60

# No tracks. SAA, CKA, boot.dev, and LeetCode are devops-ready's
# concerns — that curriculum runs in parallel and owns all cert/course
# theory. Module 5 here is still the lab where the SAA material gets
# applied; the studying happens over there.
