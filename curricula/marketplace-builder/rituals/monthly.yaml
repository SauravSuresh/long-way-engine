# Monthly rituals for Marketplace Builder curriculum
# No mock interviews — the platform is the portfolio.

- id: monthly-ship-log
  title: "Ship log — what went live in {year}-{month:02d}"
  description: |
    1st of the month: publish the ship log. Not a portfolio polish
    exercise — a factual list of what went LIVE this month on the
    booking platform: endpoints shipped, infra stood up, gates passed,
    incidents survived.

    Format:
    - What users (or test users) can do now that they couldn't last month
    - Exam gates passed this month
    - One thing that broke and what it taught
    - Link to the deployed thing

    Publish wherever the senior engineers and future employers will
    see it (blog / LinkedIn / repo CHANGELOG — pick one and stick to it).
  due: "today at {ritual_times.ship_log}"
  labels: [monthly-ritual, ship-log]
  cadence: monthly
  day_of_month: 1
  reflection:
    create_stub: true
    stub_path: "reflections/marketplace-builder/monthly/{year}-{month:02d}.md"

# (Cert check-ins are devops-ready's concern — its 15th-of-month
# certification-prep ritual covers SAA and CKA.)

# Once the platform is in production: the ops muscles get exercised
# monthly. The track flips via the Sunday state review checkbox.
- id: monthly-restore-drill
  title: "Restore drill — database restore under 1 hour, timed"
  description: |
    Monthly, from module 5 onward. Restore the production database
    from backup to a working platform, timed. Under 1 hour or it
    doesn't count (Exam gate 3 sets the bar; this keeps it passed).

    - Start the clock at "database is gone"
    - Follow the runbook only — if you improvise, the runbook is wrong;
      fix it after
    - Log the time in the drill log; investigate any regression
  due: "today at {ritual_times.restore_drill}"
  labels: [monthly-ritual, ops, drill]
  cadence: monthly
  day_of_month: 10
  gated_by:
    - { type: track, category: Platform, item: "Platform in production", states: [current] }

- id: monthly-game-day
  title: "Game day — break production on purpose, write the postmortem"
  description: |
    Monthly, last Saturday, from module 5 onward. Takes over that
    Saturday's deep block.

    Pick one failure mode (DB failover, AZ loss, webhook flood, cert
    expiry...) and inject it. Follow the runbook, restore service,
    then write the postmortem: timeline, detection gap, what the
    alerts missed, one concrete fix shipped within the week.

    The first completed game day + written postmortem is Exam gate 4.
  due: "today at {ritual_times.game_day}"
  labels: [monthly-ritual, ops, game-day]
  cadence: monthly
  day_of_month: last-saturday
  gated_by:
    - { type: track, category: Platform, item: "Platform in production", states: [current] }
