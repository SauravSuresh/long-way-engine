# Module 3: AWS Certification Sprint
- id: module-3-onboarding
  title: "Module 3: AWS Certification Sprint — Exam Prep"
  description: |
    Module 3: Final push to pass AWS Solutions Architect Associate.
    
    Goals:
    - Complete all Udemy practice exams (score 80%+)
    - Take Tutorials Dojo practice tests (6 full exams)
    - Review weak areas identified in practice tests
    - Schedule and pass AWS SAA exam
    - Continue LeetCode (Stack & Queue pattern)
    
    Exam prep checklist:
    - [ ] Complete all Udemy course sections
    - [ ] Take 6 full practice exams (Tutorials Dojo)
    - [ ] Review all incorrect answers
    - [ ] Create Anki cards for weak areas
    - [ ] Schedule exam date (aim for end of month)
    - [ ] Take exam and pass!
    
    After passing:
    - Update LinkedIn with certification
    - Add badge to GitHub profile
    - Write blog post about exam experience
  due: "today at {ritual_times.morning_udemy}"
  labels: [module-onboarding, certification]
  cadence: once-per-module
  module_number: 3

