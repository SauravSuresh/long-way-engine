- id: weekly-state-review
  title: "Weekly state review — {iso_year}-W{iso_week:02d}"
  description: |
    Check the sub-tasks that apply to your week. Next cron run picks
    them up and mutates state.yaml: module advance, certification milestones,
    track updates, counter increments.

    Review your progress:
    - Did you complete the module milestone?
    - Did you pass a certification exam?
    - How many LeetCode problems solved?
    - Did you push a project to GitHub?
  due: "today at {ritual_times.weekly_state_review}"
  labels: [weekly-ritual, state-review]
  cadence: weekly
  day_of_week: sunday
  state_review: true
  sub_tasks:
    - title: "I'm ready to advance to Module {next_module}"
      action: { type: advance_module }
      show_if: not_on_last_module

    - title: "I finished {current_book}"
      action: { type: mark_book_finished, book: "{current_book}" }

    - title: "I started a new course this week"
      action: { type: mark_book_started, book: "{next_book}" }
      show_if: book_transition_this_month

    - title: "Anki cards added this week (put count in comment)"
      action: { type: increment_counter, counter: anki_card_count }

    - title: "LeetCode problems solved this week (put count in comment)"
      action: { type: increment_counter, counter: leetcode_count }

    - title: "Revert last week's state change (only if a mistake)"
      action: { type: revert_last }

- id: weekly-project-work
  title: "Saturday deep block: Project work (3-4 hr)"
  description: |
    Dedicated time for building your GitHub portfolio project for the
    current module. This is the devops "doing" for Saturday (long-way
    reading has the morning). Production-quality work that demonstrates
    your skills to employers.

    Current module: Module {current_module}

    Project checklist:
    - [ ] Architecture diagram (draw.io or Lucidchart)
    - [ ] Infrastructure as Code (Terraform/CloudFormation)
    - [ ] CI/CD pipeline (GitHub Actions)
    - [ ] Comprehensive README with setup instructions
    - [ ] Error handling & logging
    - [ ] Tests (unit + integration)
    - [ ] Monitoring/observability hooks

    Push to GitHub with proper commit messages and PR descriptions.
  due: "today at {ritual_times.saturday_deep_block}"
  labels: [weekly-ritual, project]
  cadence: weekly
  day_of_week: saturday

- id: weekly-friday-reflection
  title: "Friday reflection: What did I learn?"
  description: |
    15-20 min. Without looking at notes, write down:
    1. The 3 most important things you learned this week
    2. One thing you struggled with and how you overcame it
    3. One thing you want to dive deeper into next week

    Then compare to your notes. The gap is what needs more Anki cards.

    Also review:
    - LeetCode problems solved (aim for 10-15/week)
    - Course progress (aim for 1-2 sections/week)
    - Project milestones hit
  due: "today at {ritual_times.friday_reflection}"
  labels: [weekly-ritual, reflection]
  cadence: weekly
  day_of_week: friday
  reflection:
    create_stub: true
    stub_path: "reflections/devops-ready/weekly/{iso_year}-W{iso_week:02d}.md"

