# Weekly rituals for DevOps Job Ready curriculum
#
# RHYTHMIC SCHEDULE (2026-08-17): one theme per evening, same anchor time
# (20:45, after dinner 19:00 + gym 19:30-20:30), done by 22:00.
#   Mon/Wed/Thu -> boot.dev (the track you're pulled toward gets plurality)
#   Tue         -> marketplace-builder ladder rung (not this file)
#   Fri         -> LeetCode (one scheduled session; a second any time you
#                  feel like it — unscheduled, that's the slack)
#   Sat         -> reflection + state review after the platform block;
#                  EVERYTHING ends Saturday, Sunday is completely free.
# REMOVED 2026-08-17: bootdev tue/fri, leetcode mon/wed, Saturday project
# block (phase-1 portfolio evidence is the marketplace platform; devops
# project work returns when the curriculum reaches Docker/K8s).

- id: weekly-bootdev-monday
  title: "boot.dev backend path session"
  description: |
    Continue your boot.dev backend path. Work through the current course
    module, complete exercises, and build the projects. This is your
    structured evening "doing" time for backend fundamentals.

    Track progress in the course platform. When you complete a major
    milestone (finish a course, complete a project), mark it in your
    weekly state review.
  due: "today at {ritual_times.bootdev_monday}"
  labels: [weekly-ritual, bootdev]
  cadence: weekly
  day_of_week: monday
  gated_by:
    - { type: track, category: Courses, item: "boot.dev backend path", states: [current] }

