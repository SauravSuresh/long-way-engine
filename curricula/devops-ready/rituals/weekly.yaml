# --- LeetCode: one scheduled session (Friday) ---

- id: weekly-leetcode-friday
  title: "LeetCode pattern session (60 min)"
  description: |
    Focus on one pattern. Do 3-4 problems of the same pattern, then write
    it up in your notes: when to use it, template code, common variations,
    time/space complexity.

    Pattern rotation (roughly): Arrays & Hashing, Two Pointers & Sliding
    Window, Stack & Queue, Binary Search & Trees, Graphs (DFS/BFS),
    Dynamic Programming, Backtracking & Greedy, Heap & Priority Queue.

    One scheduled session per week is the floor, not the ceiling — an
    extra unscheduled session any day you feel like it is a bonus, never
    a debt.
  due: "today at {ritual_times.leetcode_session}"
  labels: [weekly-ritual, interview-prep]
  cadence: weekly
  day_of_week: friday
  gated_by:
    - { type: track, category: "Interview Prep", item: "LeetCode Interview Prep", states: [current] }

- id: weekly-reflection
  title: "Weekly reflection — run `lw reflect` (10 min)"
  description: |
    Part of the Saturday close-out sitting (after the platform deep
    block, alongside the marketplace reflection and both state reviews).
    Run `lw reflect` in the long-way-engine repo — this task is the
    reminder; the sectioned form and auto-filing happen there.

    Without looking at notes:
    1. The 3 most important things you learned this week
    2. One thing you struggled with and how you overcame it
    3. One thing you want to dive deeper into next week

    Then compare to your notes. The gap is what needs more Anki cards.
  due: "today at {ritual_times.weekly_reflection}"
  labels: [weekly-ritual, reflection]
  cadence: weekly
  day_of_week: saturday
  reflection:
    create_stub: true
    stub_path: "reflections/weekly/{iso_year}-W{iso_week:02d}.md"

- id: weekly-state-review
  title: "Weekly state review — {iso_year}-W{iso_week:02d}"
  description: |
    Run `lw review` in the long-way-engine repo — this task is the
    reminder; the questionnaire and state changes happen there.
    Saturday close-out: after this, the weekend is officially over.
    Sunday is completely free.

    Answer the questionnaire honestly — it updates state.yaml
    directly: module advance, certification milestones, track
    updates, counter increments.
  due: "today at {ritual_times.weekly_state_review}"
  labels: [weekly-ritual, state-review]
  cadence: weekly
  day_of_week: saturday
  state_review: true
  sub_tasks:
    - title: "Are you ready to move on to Module {next_module}?"
      action: { type: advance_module }
      show_if: not_on_last_module

    - title: "Did you finish {current_book}?"
      action: { type: mark_book_finished, book: "{current_book}" }

    - title: "Did you start the next course ({next_book}) this week?"
      action: { type: mark_book_started, book: "{next_book}" }
      show_if: book_transition_this_month

    - title: "How many Anki cards did you add this week?"
      action: { type: increment_counter, counter: anki_card_count }

    - title: "How many LeetCode problems did you solve this week?"
      action: { type: increment_counter, counter: leetcode_count }

    - title: "Was last week's review a mistake you want to undo? (Yes reverts the last state change)"
      action: { type: revert_last }
