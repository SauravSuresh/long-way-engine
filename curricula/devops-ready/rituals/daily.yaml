# Daily rituals for DevOps Job Ready curriculum
# Required: SRS review and morning study must be present in every curriculum
#
# FOCUS SCHEDULE (2026-07): devops-ready is the primary track.
#   Mornings Mon-Fri  -> long study session ({current_book})
#   Anki daily Mon-Sat
#   Evenings           -> boot.dev every weekday + LeetCode alternate days
#                         (see rituals/weekly.yaml)
# Saturday mornings belong to the long-way curriculum (CS:APP), so the
# morning study fires Mon-Fri only, expressed as weekday templates.

- id: daily-devops-srs
  title: "Anki review (AWS/K8s/Interview prep)"
  description: |
    10–15 min. Review AWS services, K8s concepts, LeetCode patterns, and
    system design principles. Add 3–5 new cards daily from what you learned
    in Udemy courses and hands-on work.

    Card categories:
    - AWS services & use cases
    - Kubernetes objects & commands
    - Data structures & algorithms
    - System design patterns
  due: "today at {ritual_times.devops_srs}"
  labels: [daily-ritual, srs]
  cadence: daily
  skip_if: sunday
  counts_toward_streak: true

# --- Morning study: one long session, Mon-Fri (Saturday AM = long-way) ---

- id: weekday-morning-study-monday
  title: "Morning study (long session): {current_book}"
  description: |
    60–90 min deep session. Watch/read, take notes in Obsidian/Notion,
    then make Anki cards for the key concepts. Focus on understanding,
    not just watching. Current course: {current_book}.
  due: "today at {ritual_times.morning_udemy}"
  labels: [daily-ritual, learning]
  cadence: weekly
  day_of_week: monday
  counts_toward_streak: true

