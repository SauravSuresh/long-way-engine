# Daily rituals for DevOps Job Ready curriculum
# Required: SRS review and morning study must be present in every curriculum

- id: daily-devops-srs
  title: "Anki review (AWS/K8s/Interview prep)"
  description: |
    10–15 min. Review AWS services, K8s concepts, LeetCode patterns, and
    system design principles. Add 3–5 new cards daily from what you learned
    in Udemy courses and hands-on work.
    
    Card categories:
    - AWS services & use cases
    - Kubernetes objects & commands
    - Data structures & algorithms
    - System design patterns
  due: "today at {ritual_times.devops_srs}"
  labels: [daily-ritual, srs]
  cadence: daily
  skip_if: sunday
  counts_toward_streak: true

- id: daily-morning-udemy
  title: "Morning Udemy: {current_book}"
  description: |
    30–45 min. Watch course videos, take notes in Obsidian/Notion.
    Focus on understanding concepts, not just watching.
    
    Current course: {current_book}
    
    After each section, create Anki cards for key concepts.
  due: "today at {ritual_times.morning_udemy}"
  labels: [daily-ritual, learning]
  cadence: daily
  skip_if: sunday
  counts_toward_streak: true

- id: daily-evening-hands-on
  title: "Evening hands-on: Projects + LeetCode"
  description: |
    60–90 min split:
    - 30–45 min: Work on current module's GitHub project
    - 30–45 min: LeetCode (1-2 problems, focus on patterns)
    
    Projects should be production-quality with:
    - Clean README with architecture diagrams
    - CI/CD pipeline
    - Infrastructure as Code
    - Proper error handling & logging
    
    LeetCode: Focus on patterns (sliding window, two pointers, DFS/BFS, etc.)
    rather than random problems. Track progress in spreadsheet.
  due: "today at {ritual_times.evening_hands_on}"
  labels: [daily-ritual, hands-on]
  cadence: daily
  skip_if:
    - sunday
    - pair_day

