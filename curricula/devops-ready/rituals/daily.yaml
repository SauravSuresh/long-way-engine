# Daily rituals for DevOps Job Ready curriculum
# Required: SRS review and morning study must be present in every curriculum
#
# RHYTHMIC SCHEDULE (2026-08-17): one theme per evening, anchored 20:45.
#   Mornings Mon-Fri  -> long study session ({current_book}) at 08:00
#   Evenings          -> Mon/Wed/Thu boot.dev, Fri LeetCode
#                        (see rituals/weekly.yaml; Tue = marketplace ladder)
#
# REQUIRED-RITUAL NOTE: the daily SRS ritual is NOT omitted — it lives on
# the marketplace-builder curriculum's `daily-anki` template (07:15), one
# sitting that reviews every deck including this curriculum's cert deck.
# Two checkbox tasks for one Anki habit was bookkeeping theater.

# --- Morning study: one long session, Mon-Fri ---

- id: weekday-morning-study-monday
  title: "Morning study (long session): {current_book}"
  description: |
    60–90 min deep session. Watch/read, take notes in Obsidian/Notion,
    then make Anki cards for the key concepts. Focus on understanding,
    not just watching. Current course: {current_book}.
  due: "today at {ritual_times.morning_udemy}"
  labels: [daily-ritual, learning]
  cadence: weekly
  day_of_week: monday
  counts_toward_streak: true

