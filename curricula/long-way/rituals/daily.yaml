# SATURDAY-ONLY SCHEDULE: long-way relegated to Saturdays while devops-ready
# is the focus track. CS:APP is dry but the owner wants to keep it alive, so
# it runs as one long Saturday reading session (+ Anki) rather than stopping.
#
# Timeline extends proportionally (1 day/week instead of 3).
# Kept: Saturday morning reading (long session) + Saturday Anki.
# Removed: Monday and Wednesday sessions, evening hands-on.

- id: weekly-saturday-morning-reading
  title: "Morning reading (long session): {current_book}"
  description: |
    60–90 min. Paper book, paper notebook, no laptop.
    Same chair, same time. This is the one long-way session of the week —
    make it count. Today's book: {current_book}.

    SATURDAY-ONLY SCHEDULE: the sole long-way study day.
  due: "today at {ritual_times.morning_reading}"
  labels: [weekly-ritual, reduced-schedule]
  cadence: weekly
  day_of_week: saturday
  counts_toward_streak: true

- id: weekly-saturday-anki
  title: "Anki review"
  description: |
    10–15 min. Whenever — commute, lunch, before bed.
    Add 3–5 new cards from what you read. No more.

    SATURDAY-ONLY SCHEDULE: the sole long-way study day.
  due: "today at {ritual_times.anki}"
  labels: [weekly-ritual, reduced-schedule]
  cadence: weekly
  day_of_week: saturday
  counts_toward_streak: true

# REMOVED: Monday + Wednesday morning-reading/anki (was a 3-day/week plan).
# Reason: long-way relegated to Saturdays only; devops-ready is the focus.
